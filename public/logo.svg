<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="elBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F2A"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="elAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA270"/>
      <stop offset="1" stop-color="#D9572B"/>
    </linearGradient>
  </defs>
  <!-- macOS-style squircle tile with standard 100px safe margin -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#elBg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <!-- single tilted orbit -->
  <ellipse cx="512" cy="512" rx="300" ry="122" transform="rotate(-28 512 512)" fill="none" stroke="url(#elAccent)" stroke-width="26" stroke-opacity="0.9"/>
  <!-- terminal prompt >_ as the nucleus -->
  <path d="M404 420 L496 512 L404 604" fill="none" stroke="#F4F1EA" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="528" y="580" width="112" height="44" rx="22" fill="#F4F1EA"/>
  <!-- the electron -->
  <circle cx="776" cy="371" r="40" fill="url(#elAccent)"/>
</svg>

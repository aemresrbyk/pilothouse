# Generate the Xcode project with: xcodegen (brew install xcodegen). The .xcodeproj is not committed.
name: Pilothouse
options:
  bundleIdPrefix: com.aemresrbyk
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: RHN7LUWPD2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.13.0
    CURRENT_PROJECT_VERSION: 11
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pilothouse:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aemresrbyk.pilothouse.mobile
        TARGETED_DEVICE_FAMILY: "1" # iPhone only; xcodegen sets "1,2" per iOS target otherwise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pilothouse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [remote-notification]
        NSCameraUsageDescription: Scan the pairing QR code shown in Pilothouse on your computer.
        NSMicrophoneUsageDescription: Speak a message to your agent instead of typing it.
        NSSpeechRecognitionUsageDescription: Turns what you say into a message for your agent, on this iPhone when it can.
        NSFaceIDUsageDescription: Confirms it is you before a risky command is approved.
        NSSupportsLiveActivities: true
        # Talks plain HTTP to your computer's Tailscale address; Tailscale itself encrypts the traffic.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false # CryptoKit only (Apple OS encryption)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [pilothouse]
    entitlements:
      path: App/Pilothouse.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.aemresrbyk.pilothouse]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.aemresrbyk.pilothouse.shared"]
    dependencies:
      - target: PilothouseWidget
      - target: PilothouseNotifications
  PilothouseWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aemresrbyk.pilothouse.mobile.widget
        TARGETED_DEVICE_FAMILY: "1" # iPhone only; xcodegen sets "1,2" per iOS target otherwise
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Pilothouse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Widget/PilothouseWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aemresrbyk.pilothouse]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.aemresrbyk.pilothouse.shared"]
  PilothouseNotifications:
    type: app-extension
    platform: iOS
    sources: [Notifications, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aemresrbyk.pilothouse.mobile.notifications
        TARGETED_DEVICE_FAMILY: "1" # iPhone only; xcodegen sets "1,2" per iOS target otherwise
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Pilothouse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notifications/PilothouseNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aemresrbyk.pilothouse]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.aemresrbyk.pilothouse.shared"]

name = "pilothouse-push"
main = "worker.js"
# Keep the workers.dev address: Pilothouse 1.x sends pushes there.
workers_dev = true
# Web remote rooms live at relay.usepilothouse.com (Cloudflare DNS, same account).
routes = [{ pattern = "relay.usepilothouse.com", custom_domain = true }]
compatibility_date = "2026-11-01"

# No logs: the relay keeps nothing about who sends what.
[observability]
enabled = false

[vars]
APNS_TOPIC = "com.aemresrbyk.pilothouse.mobile"

# Per-IP rate limit (free on Workers): 60 pushes a minute from one computer is plenty.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Web remote rooms (usepilothouse.com/app). SQLite-backed Durable Objects are on the Workers free plan; rooms
# use WebSocket hibernation and store nothing.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

name: Build & Release Pilothouse

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Distribution (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Web Assets & App Bundle
        run: bun run build

      # Signing/notarization switch on automatically once these repository secrets exist:
      #   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD   (Developer ID Application certificate)
      #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   (notarization)
      # Without them the build stays unsigned, as before.
      - name: Package macOS DMG & ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "No signing certificate secret: building unsigned."
          elif [ -n "$APPLE_ID" ]; then
            EXTRA="-c.mac.notarize=true"
          fi
          bun x electron-builder --mac --${{ matrix.arch }} --publish never $EXTRA

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-installer
          path: |
            release/*.dmg
            release/*.zip

  release:
    name: Create GitHub Release
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos-arm64-installer/*.dmg
            macos-arm64-installer/*.zip
            macos-x64-installer/*.dmg
            macos-x64-installer/*.zip
          generate_release_notes: true


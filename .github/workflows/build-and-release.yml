name: Build & Release Pilothouse

# macOS runners cost 10x Linux minutes, so only release tags (and a manual
# run from the Actions tab) build. Pushes and PRs to main no longer do.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Distribution (arm64 + x64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build whisper-cli (voice prompts)
        run: brew list cmake >/dev/null 2>&1 || brew install cmake; bash scripts/build-whisper.sh

      - name: Build Web Assets & App Bundle
        run: bun run build

      # Signing/notarization switch on automatically once these repository secrets exist:
      #   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD   (Developer ID Application certificate)
      #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   (notarization)
      # Without them the build stays unsigned, as before.
      - name: Package macOS DMG & ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "No signing certificate secret: building unsigned."
          elif [ -n "$APPLE_ID" ]; then
            EXTRA="-c.mac.notarize=true"
          fi
          # Both archs in one run so latest-mac.yml (the auto-updater's feed) lists both.
          bun x electron-builder --mac --arm64 --x64 --publish never $EXTRA

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  release:
    name: Create GitHub Release
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos-installers/*.dmg
            macos-installers/*.zip
            macos-installers/*.blockmap
            macos-installers/latest-mac.yml
          generate_release_notes: true

